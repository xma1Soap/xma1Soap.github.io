<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mint's page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0f0f1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 2rem;
        }
        .wave {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .dots {
            display: flex;
            gap: 0.8rem;
            justify-content: center;
            margin-top: 2rem;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a78bfa;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .dot:nth-child(1) { animation-delay: -0.32s; background: #a78bfa; }
        .dot:nth-child(2) { animation-delay: -0.16s; background: #6ee7b7; }
        .dot:nth-child(3) { animation-delay: 0s; background: #fbbf24; }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wave">👋</div>
        <h1>Hi</h1>
        <p>This page is under construction. Something cool is coming.</p>
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>
</body>
</html>
